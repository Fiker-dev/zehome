name: Render product cards

# Renders the branded images for new products (benefits / how it works /
# comparison cards from scripts/product-cards/cards.json, and kit covers from
# scripts/product-cards/kit-covers.mjs) and commits them. Only renders what is
# missing, so existing images never change. Runs after "Fetch product images"
# has stored the supplier photos the kit covers are built from.
on:
  workflow_run:
    workflows: ["Fetch product images"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - scripts/product-cards/**
      - .github/workflows/render-product-cards.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-product-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright + Chromium
        run: |
          npm i -g playwright@1.56.0
          playwright install --with-deps chromium
      - name: Render missing cards
        run: node scripts/product-cards/render.mjs --missing
      - name: Render missing kit covers
        run: node scripts/product-cards/kit-covers.mjs --missing
      - name: Commit images
        run: |
          if [ -z "$(git status --porcelain public/images/products)" ]; then echo "Nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/products
          git commit -m "Render product cards"
          git pull --rebase
          git push
